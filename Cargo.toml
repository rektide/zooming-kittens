[package]
name = "kitty-focus-tracker"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kitty-focus-tracker"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.56", features = ["derive"] }
dashmap = "6.1.0"
dirs = "6.0.0"
facet = { version = "0.46", optional = true }
facet-json = { version = "0.46", optional = true }
figment2 = { version = "0.11.4", features = ["toml"] }
futures = "0.3"
kitty-rc = "0.5.0"
niri-ipc = "26.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = "1.49.0"
tokio-stream = "0.1"

[features]
export-facet = ["dep:facet", "dep:facet-json"]

[dev-dependencies]
tempfile = "3.16"
